seed: 42
source_mode: abo_rendered_audit
num_products: 3000
samples_per_product:
  sft: 4
  grpo: 2
  opd: 2
  test: 2
page_width: 960
page_height: 720
# Source components are assigned to exactly one stage before pages are rendered.
dataset_stage_ratios:
  sft: 0.50
  grpo: 0.25
  opd: 0.15
  test: 0.10
stage_validation_ratio: 0.10
# Retained only for the synthetic test fixture path.
split_ratios:
  train: 0.80
  validation: 0.10
  test: 0.10
paths:
  raw_images: data/raw/images
  abo_root: data/raw/abo
  generated: data/generated
  manifests: data/manifests
abo:
  locale: en_US
  max_products_per_type: 25
  min_image_width: 160
  min_image_height: 160
  phash_distance_threshold: 4
  download_workers: 12
  max_metadata_bytes: 120000000
  max_selected_image_bytes: 400000000
  listing_archive_url: https://amazon-berkeley-objects.s3.us-east-1.amazonaws.com/archives/abo-listings.tar
  image_metadata_url: https://amazon-berkeley-objects.s3.us-east-1.amazonaws.com/images/metadata/images.csv.gz
  small_image_base_url: https://amazon-berkeley-objects.s3.us-east-1.amazonaws.com/images/small
class_minimums:
  pass: 50
  duplicate_detail_image: 50
  image_quality: 50
  wrong_image: 50
  category_mismatch: 50
  color_mismatch: 50
  material_mismatch: 50
  title_mismatch: 50
