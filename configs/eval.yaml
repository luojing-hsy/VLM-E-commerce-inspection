schema_version: "2.0"
dataset_split: test
source_dataset: data/test/test.jsonl
pages_root: outputs/evaluation
page_width: 960
page_height: 720
manifest: outputs/evaluation/samples_test.jsonl
counterfactual_manifest: outputs/evaluation/counterfactuals_test.jsonl
predictions: outputs/evaluation/predictions.jsonl
output: outputs/evaluation/metrics.json
min_pixels: 784
max_pixels: 65536
max_new_tokens: 256
target_class_prior:
  pass: 0.60
  reject: 0.40
cost_matrix:
  pass: {pass: 0.0, reject: 0.9}
  reject: {pass: 1.0, reject: 0.0}
# Freeze these after collecting the base-model validation baseline.
frozen_thresholds:
  configured: false
  opd_non_inferiority_margin: null
  opd_business_risk_non_inferiority_margin: null
  min_gap_improvement: null
  min_business_risk_improvement: null
