stage: opd
dataset: data/manifests/opd_train.jsonl
validation_dataset: data/manifests/opd_validation.jsonl
output_dir: outputs/opd
precision: bf16
quantization: none
student_checkpoint: outputs/grpo/best
teacher_checkpoint: outputs/grpo/best
teacher_adapter_frozen: true
student_adapter_trainable: true
num_rollouts_per_prompt: 2
temperature: 0.7
top_p: 0.95
max_completion_length: 256
top_k_logits: 64
learning_rate: 2.0e-6
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
