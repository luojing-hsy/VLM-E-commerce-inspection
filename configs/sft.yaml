lora_alpha: 32
lora_dropout: 0.05
learning_rate: 1.0e-5
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_sequence_length: 2048
max_output_length: 256
min_pixels: 784
max_pixels: 50176
